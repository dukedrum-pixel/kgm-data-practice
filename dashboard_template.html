<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공공데이터 분석 실습 대시보드</title><style>
:root{font-family:Arial,'Noto Sans KR',sans-serif;color:#24213a;background:#f8f7fc}body{max-width:1000px;margin:0 auto;padding:20px;line-height:1.5}h1{margin-bottom:3px}small,.muted{color:#625b78}.card{background:#fff;border:1px solid #e7e1f3;border-radius:14px;padding:20px;margin:14px 0}.notice{background:#f0eaff;border-left:4px solid #642bf1;padding:12px;border-radius:6px;margin-top:14px}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:grid;gap:5px;font-weight:600}select,button{min-height:42px;padding:9px 12px;border:1px solid #cfc6e6;border-radius:7px;font:inherit}select:focus-visible,button:focus-visible{outline:3px solid #a58aff;outline-offset:2px}button{background:#642bf1;color:white;border:0;cursor:pointer}button:hover{background:#4f1bc9}.metric{font-size:28px;font-weight:700;margin:4px 0}.chart-wrap{overflow-x:auto}svg{display:block;width:100%;min-width:520px;height:280px;overflow:visible}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:560px}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}th{background:#f5f0fc;position:sticky;top:0}.empty{text-align:center;color:#625b78;padding:24px}@media(max-width:600px){body{padding:12px}.card{padding:15px}.controls{align-items:stretch}.controls label{flex:1 1 100%}select,button{width:100%}}</style></head><body>
<h1>원자재 가격지수 실습 대시보드</h1><small>Codex × GitHub Pages · 정적 HTML 데모</small>
<div class="notice" id="sourceNote">교육용 가상 수치 · 실제 공공데이터나 KGM 구매가격이 아닙니다.</div>
<section class="card"><div class="controls"><label>품목 <select id="item" aria-label="품목 선택"></select></label><label>연도 <select id="year" aria-label="연도 선택"><option value="all">전체 연도</option></select></label><button id="download" type="button">화면 데이터 CSV 다운로드</button></div><p class="muted" id="resultCount" aria-live="polite"></p></section>
<section class="card"><small id="rangeLabel">선택 구간 시작 → 종료 변화율</small><div class="metric" id="kpi" aria-live="polite">-</div><div class="chart-wrap"><svg id="chart" viewBox="0 0 720 280" role="img" aria-label="월별 가격 지수 선 그래프"></svg></div><small class="muted">점 위에 마우스를 올리면 월과 지수를 확인할 수 있습니다.</small></section>
<section class="card"><h2>월별 데이터</h2><div class="tablewrap"><table><thead><tr><th>월</th><th>품목</th><th>지수</th><th>전월비*</th><th>자료구분</th></tr></thead><tbody id="tbody"></tbody></table></div><small>* 전월비는 선택한 기간 안에서 바로 전월 데이터가 있을 때만 계산합니다.</small></section>
<script>const rows=/*__DATA__*/;const item=document.getElementById('item'),year=document.getElementById('year'),tbody=document.getElementById('tbody'),chart=document.getElementById('chart'),kpi=document.getElementById('kpi'),resultCount=document.getElementById('resultCount'),rangeLabel=document.getElementById('rangeLabel');
const itemNames=[...new Map(rows.map(r=>[r.code,r.name])).entries()]; itemNames.forEach(([code,name])=>item.add(new Option(name,code))); [...new Set(rows.map(r=>r.month.slice(0,4)))].sort().forEach(y=>year.add(new Option(y,y)));function chosen(){return rows.filter(r=>r.code===item.value&&(year.value==='all'||r.month.startsWith(year.value))).sort((a,b)=>a.month.localeCompare(b.month))}function consecutiveMonths(previous,current){const ordinal=month=>Number(month.slice(0,4))*12+Number(month.slice(5,7));return ordinal(current)-ordinal(previous)===1}function show(){const a=chosen();tbody.replaceChildren();chart.replaceChildren();resultCount.textContent=`현재 ${a.length}개월 데이터`;document.getElementById('download').disabled=!a.length;if(!a.length){kpi.textContent='데이터 없음';rangeLabel.textContent='선택 결과';const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.className='empty';td.textContent='선택한 조건에 해당하는 데이터가 없습니다.';tr.append(td);tbody.append(tr);return}rangeLabel.textContent=`${a[0].month} → ${a.at(-1).month} 변화율`;let rate=(a.at(-1).value/a[0].value-1)*100;kpi.textContent=(a.length>1?(rate>0?'+':'')+rate.toFixed(2)+'%':'비교 불가');const vals=a.map(r=>r.value),low=Math.min(...vals),high=Math.max(...vals),pad=(high-low)*.1||Math.abs(high)*.05||1,min=low-pad,max=high+pad,px=i=>48+(a.length===1?316:i/(a.length-1)*632),py=v=>235-(v-min)/(max-min)*190;const ns='http://www.w3.org/2000/svg';function node(tag,attrs,text){let n=document.createElementNS(ns,tag);for(let k in attrs)n.setAttribute(k,attrs[k]);if(text!==undefined)n.textContent=text;chart.append(n);return n}node('line',{x1:48,y1:235,x2:690,y2:235,stroke:'#999'});node('polyline',{points:a.map((r,i)=>px(i)+','+py(r.value)).join(' '),fill:'none',stroke:'#642bf1','stroke-width':3});a.forEach((r,i)=>{const point=node('circle',{cx:px(i),cy:py(r.value),r:5,fill:'#642bf1',tabindex:0,role:'img','aria-label':`${r.month}: ${r.value.toFixed(2)}`});const title=document.createElementNS(ns,'title');title.textContent=`${r.month}: ${r.value.toFixed(2)}`;point.append(title);if(i===0||i===a.length-1||i%3===0)node('text',{x:px(i),y:258,'text-anchor':'middle','font-size':11},r.month.slice(2))});a.forEach((r,i)=>{const prev=a[i-1],consecutive=prev&&consecutiveMonths(prev.month,r.month);const d=consecutive?(r.value/prev.value-1)*100:null;const tr=document.createElement('tr');[r.month,r.name,r.value.toFixed(2),d===null?'-':(d>0?'+':'')+d.toFixed(2)+'%',r.source].forEach(x=>{let td=document.createElement('td');td.textContent=x;tr.append(td)});tbody.append(tr)})}item.onchange=show;year.onchange=show;document.getElementById('download').onclick=()=>{const a=chosen();if(!a.length)return;const safeText=x=>{const s=String(x);return /^[\u0000-\u0020]*[=+\-@]/.test(s)?"'"+s:s},quote=x=>'"'+String(x).replaceAll('"','""')+'"',csv=['month,item_code,item_name,index_value,source',...a.map(r=>[quote(safeText(r.month)),quote(safeText(r.code)),quote(safeText(r.name)),r.value,quote(safeText(r.source))].join(','))].join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'})),el=document.createElement('a');el.href=url;el.download=`price-index-${item.value}-${year.value}.csv`;document.body.append(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};show();</script></body></html>
